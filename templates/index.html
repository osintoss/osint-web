<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT Search Engine</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 40px; display: flex; justify-content: center; }
        .container { max-width: 600px; width: 100%; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 25px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 16px; outline: none; }
        button { padding: 12px 24px; border: none; background: #0284c7; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background: #0369a1; }
        .card { background: #334155; padding: 12px 16px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .card a { color: #38bdf8; text-decoration: none; word-break: break-all; }
        .status { background: #22c55e; color: #000; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔍 OSINT Search Tool</h1>
    
    <form method="POST" class="search-box">
        <input type="text" name="query" placeholder="Введите никнейм..." value="{{ query }}" required>
        <button type="submit">Искать</button>
    </form>

    {% if results is not none %}
        <h3>Результаты поиска:</h3>
        {% if results %}
            {% for res in results %}
                <div class="card">
                    <div>
                        <strong>{{ res.site }}:</strong> <a href="{{ res.url }}" target="_blank">{{ res.url }}</a>
                    </div>
                    <span class="status">{{ res.status }}</span>
                </div>
            {% endfor %}
        {% else %}
            <p>Ничего не найдено.</p>
        {% endif %}
    {% endif %}
</div>

</body>
</html>
